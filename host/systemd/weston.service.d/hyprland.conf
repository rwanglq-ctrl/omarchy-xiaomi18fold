# Installed by omarchy-alarm-nspawn (host/install.sh).
# Start hypr-session instead of Weston when the Android Terminal enables its display.
# The app calls `systemctl --user start weston` (see /usr/local/bin/enable_display).
# hypr-session picks Debian's desktop or the Arch container's Hyprland (`hypr-switch arch|debian`).
# Revert: delete this file, then `systemctl --user daemon-reload`.
[Unit]
Description=Hyprland (replacing Weston) for the Android Terminal display

[Service]
Type=simple
ExecStart=
ExecStart=%h/.local/bin/hypr-session
Environment=XDG_CURRENT_DESKTOP=Hyprland XDG_SESSION_DESKTOP=Hyprland
# The Arch container runs as root under sudo, which the user manager can't kill on stop,
# so terminate it explicitly or a stale arch-desktop blocks the next start.
TimeoutStopSec=60
# The shell reports its handled TERM as 128+15 after successful cleanup.
SuccessExitStatus=143
ExecStopPost=-%h/.local/bin/hypr-session --cleanup
